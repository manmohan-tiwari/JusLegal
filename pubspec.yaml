name: juslegal
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'
  
dependencies:
  flutter:
    sdk: flutter
  speech_to_text: ^6.6.0
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  hive_flutter: ^1.1.0
  dio: ^5.4.0
  google_fonts: ^8.1.0
  lottie: ^3.0.0
  share_plus: ^10.0.0
  url_launcher: ^6.2.4
  package_info_plus: ^8.0.0
  intl: ^0.20.2
  shared_preferences: ^2.3.0
  cupertino_icons: ^1.0.2
  shimmer: ^3.0.0
  connectivity_plus: ^4.0.0
  device_preview: ^1.2.0

  firebase_core: ^4.9.0
  firebase_analytics: ^12.4.1
  firebase_crashlytics: ^5.2.2
  firebase_auth: 6.5.2
  google_sign_in: ^6.2.0
  file_picker: ^8.1.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/legal_kb.json
    - assets/legal_kb_expanded.json
    - assets/community_wins.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#1A237E"
  adaptive_icon_foreground: assets/icon/foreground.png
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#1A237E"

flutter_native_splash:
  color: "#1A237E"
  color_dark: "#101A5E"
  image: assets/icon/foreground.png
  web: false
  android_12:
    color: "#1A237E"
    color_dark: "#101A5E"
    image: assets/icon/foreground.png
    icon_background_color: "#1A237E"
    icon_background_color_dark: "#101A5E"