name: juslegal
description: "Consumer legal guidance app for Indian citizens."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'
  
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  speech_to_text: ^7.0.0
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  hive_flutter: ^1.1.0
  dio: ^5.4.0
  google_fonts: ^8.1.0
  lottie: ^3.0.0
  share_plus: ^10.0.0
  url_launcher: ^6.2.4
  package_info_plus: ^8.0.0
  intl: ^0.20.2
  shared_preferences: ^2.3.0
  cupertino_icons: ^1.0.2
  shimmer: ^3.0.0
  connectivity_plus: ^4.0.0
  device_preview: ^1.2.0
  flutter_dotenv: ^5.1.1
  flutter_markdown: ^0.7.7+1
  pdf: ^3.11.0
  printing: ^5.13.0

  firebase_core: ^4.9.0
  firebase_analytics: ^12.4.1
  firebase_crashlytics: ^5.2.2
  firebase_auth: 6.5.2
  google_sign_in: ^6.2.0
  file_picker: ^8.1.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/legal_kb.json
    - assets/images/juslegal_logo.png

  fonts:
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/Fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/Fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
