plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"  // Firebase Google Services plugin
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('local.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace "com.juslegal.app"
    compileSdkVersion 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    signingConfigs {
        release {
            storeFile file('juslegal-release.jks')
            storePassword keystoreProperties['JUSLEGAL_STORE_PASSWORD']
            keyAlias keystoreProperties['JUSLEGAL_KEY_ALIAS']
            keyPassword keystoreProperties['JUSLEGAL_KEY_PASSWORD']
        }
    }

    defaultConfig {
        applicationId "com.juslegal.app"
        // Flutter currently resolves this to API 24, which supports multidex natively.
        minSdkVersion flutter.minSdkVersion
        multiDexEnabled = true
        targetSdkVersion 36
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source '../..'
}

dependencies {}
