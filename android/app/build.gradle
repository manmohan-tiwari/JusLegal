plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"  // Firebase Google Services plugin
}

def keystoreProperties = new Properties()
def keyPropertiesFile = rootProject.file('key.properties')
if (keyPropertiesFile.exists()) {
    keyPropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
} else {
    def localPropertiesFile = rootProject.file('local.properties')
    if (localPropertiesFile.exists()) {
        localPropertiesFile.withReader('UTF-8') { reader ->
            keystoreProperties.load(reader)
        }
    }
}

android {
    namespace "com.juslegal.app"
    compileSdkVersion 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    signingConfigs {
        release {
            def storePasswordProp = keystoreProperties['storePassword'] ?: keystoreProperties['JUSLEGAL_STORE_PASSWORD'] ?: System.getenv('JUSLEGAL_STORE_PASSWORD')
            def keyPasswordProp = keystoreProperties['keyPassword'] ?: keystoreProperties['JUSLEGAL_KEY_PASSWORD'] ?: System.getenv('JUSLEGAL_KEY_PASSWORD')
            def keyAliasProp = keystoreProperties['keyAlias'] ?: keystoreProperties['JUSLEGAL_KEY_ALIAS'] ?: System.getenv('JUSLEGAL_KEY_ALIAS')
            def storeFileProp = keystoreProperties['storeFile'] ?: keystoreProperties['JUSLEGAL_STORE_FILE'] ?: 'juslegal-release.jks'

            storeFile file(storeFileProp)
            storePassword storePasswordProp
            keyAlias keyAliasProp
            keyPassword keyPasswordProp
        }
    }

    defaultConfig {
        applicationId "com.juslegal.app"
        minSdkVersion 24
        multiDexEnabled = true
        targetSdkVersion 36
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {}
